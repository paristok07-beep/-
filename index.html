<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Για Εσένα ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 2;
      max-width: 500px;
    }

    h1 {
      color: white;
      font-size: 3rem;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    p {
      color: white;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #ff4f81;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.1);
      background: #ff4f81;
      color: white;
    }

    .heart {
      position: absolute;
      color: #ff2d55;
      font-size: 20px;
      animation: float 4s linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-600px) scale(2);
        opacity: 0;
      }
    }

    .background-heart {
      position: absolute;
      color: rgba(255,255,255,0.15);
      animation: drift 12s linear infinite;
      pointer-events: none;
    }

    @keyframes drift {
      from {
        transform: translateY(100vh) rotate(0deg);
      }
      to {
        transform: translateY(-120vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Για Σένα ❤️</h1>
    <p>
      Είσαι το πιο όμορφο πράγμα που μου έχει συμβεί ✨
    </p>

    <div class="buttons">
      <button onclick="spawnHearts(20)">Πάτα Με 💖</button>
      <button onclick="spawnHearts(50)">Περισσότερη Αγάπη 💘</button>
      <button onclick="loveMessage()">Μήνυμα ❤️</button>
    </div>
  </div>

  <script>
    function spawnHearts(amount) {
      for (let i = 0; i < amount; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤';

        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.top = window.innerHeight - 50 + 'px';
        heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }
    }

    function loveMessage() {
      spawnHearts(35);

      const modal = document.createElement('div');
      modal.style.position = 'fixed';
      modal.style.top = '0';
      modal.style.left = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.background = 'rgba(0,0,0,0.6)';
      modal.style.display = 'flex';
      modal.style.justifyContent = 'center';
      modal.style.alignItems = 'center';
      modal.style.padding = '20px';
      modal.style.zIndex = '9999';

      const box = document.createElement('div');
      box.style.background = '#ffd1dc';
      box.style.maxWidth = '700px';
      box.style.width = '100%';
      box.style.maxHeight = '80vh';
      box.style.overflowY = 'auto';
      box.style.padding = '30px';
      box.style.borderRadius = '25px';
      box.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
      box.style.color = '#111';
      box.style.fontSize = '1.1rem';
      box.style.lineHeight = '1.8';
      box.style.position = 'relative';
      box.style.animation = 'popup 0.4s ease';

      box.innerHTML = `
        <h2 style="margin-bottom:20px; text-align:center;">❤️ Για Σένα ❤️</h2>
        <p>
        Ιωάννα μου,<br><br>

        θέλω να ξέρεις πόσο πολύ σε αγαπάω και πόσο σημαντική είσαι για μένα. Από τη στιγμή που μπήκες στη ζωή μου, όλα απέκτησαν άλλο νόημα. Δεν θέλω να είμαι δίπλα σου μόνο στις όμορφες στιγμές και στα χαμόγελα, αλλά και στις δύσκολες μέρες, στις στεναχώριες και σε κάθε πρόβλημα που μπορεί να σε βαραίνει.<br><br>

        Τα προβλήματά σου είναι και δικά μου πλέον, γιατί είμαστε μαζί και θέλω να περνάμε τα πάντα σαν ένα. Δεν χρειάζεται ποτέ να νιώθεις μόνη σου ή να κρατάς κάτι μέσα σου. Μπορείς να μου μιλάς για τα πάντα χωρίς φόβο, χωρίς δεύτερες σκέψεις. Εγώ θα είμαι πάντα εδώ να σε ακούω, να σε στηρίζω και να σε κρατάω όταν νιώθεις ότι λυγίζεις.<br><br>

        Σε αγαπάω αληθινά και θέλω να ξέρεις ότι ό,τι κι αν γίνει, θα έχεις πάντα έναν άνθρωπο δίπλα σου που θα νοιάζεται για σένα με όλη του την καρδιά.<br><br>

        ❤️
        </p>

        <button id="closeBtn" style="margin-top:20px; width:100%; padding:15px; border:none; border-radius:15px; background:#ff4f81; color:white; font-size:1rem; cursor:pointer;">Κλείσιμο ❤️</button>
      `;

      modal.appendChild(box);
      document.body.appendChild(modal);

      document.getElementById('closeBtn').onclick = () => {
        modal.remove();
      };
    }

    function createBackgroundHearts() {
      for (let i = 0; i < 20; i++) {
        const bgHeart = document.createElement('div');
        bgHeart.classList.add('background-heart');
        bgHeart.innerHTML = '❤';

        bgHeart.style.left = Math.random() * 100 + 'vw';
        bgHeart.style.fontSize = (Math.random() * 40 + 20) + 'px';
        bgHeart.style.animationDuration = (Math.random() * 10 + 8) + 's';
        bgHeart.style.animationDelay = Math.random() * 5 + 's';

        document.body.appendChild(bgHeart);
      }
    }

    createBackgroundHearts();
  </script>

</body>
</html>
